<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ignite</title>
       <link href="src/output.css" rel="stylesheet"> 
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css" integrity="sha512-DxV+EoADOkOygM4IR9yXP8Sb2qwgidEmeqAEmDKIOfPRQZOWbXCzLC6vjbZyy0vPisbH2SyW27+ddLVCN+OMzQ==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body class="flex bg-white min-h-screen">
   <!-- this is a side panel -->
   <aside class="flex bg-red-800 w-64 flex-col text-white">
      <div class="text-xl p-4 border-b border-red-700 font-bold ">Ignite Task</div>

         <nav class="flex-1 p-4 space-y-2">
      <a href="" class="block px-3 py-2 rounded-lg hover:border-red-700"><i class="fa fa-chart-pie mx-2"></i>Dashboard</a>
       <a href="" class="block px-3 py-2 rounded-lg hover:border-red-700"><i class="fa fa-tasks mx-2"></i>Tasks</a>
       <a href="" class="block px-3 py-2 rounded-lg hover:border-red-700"><i class="fa fa-briefcase mx-2"></i>Projects</a>
       <a href="" class="block px-3 py-2 rounded-lg hover:border-red-700"><i class="fa fa-calendar-days mx-2"></i>Calender</a>
     
   
   </nav>
   </aside>
<!-- main content -->
 <div class="flex flex-1 flex-col mx-auto">
<!-- top nav -->
 <header class="items-center bg-white p-4 shadow ">
<div class="flex items-center justify-between">
<input type="text" placeholder="Search...." id="searchBar" class="border-none rounded-lg w-65 px-3 py-2 ring-2 focus:ring-blue-300 bg-[url(src/)]">
<div class="flex items-center">
   <span class="mx-2">Hello, Ernest</span> 
<img class="rounded-full w-10 h-10" src="src/img/user ernest.jpg" alt=""></div>
</div>
 </header>


<!-- task section -->
 <div class="flex justify-between items-center mx-10 my-5 "><h1 class="text-3xl font-bold">Tasks</h1>
<button class="bg-red-800 rounded py-2 px-3 font-normal text-white ">New Task</button>
</div>

   <div class="w-screen fixed left-0 right-0  h-screen flex justify-center items-center font-bold  "></div>
   <div class="hidden absolute inset-0 bg-black opacity-50"></div>
        <form action="" class="hidden absolute left-100 top-25 bg-white h-[75%] w-[50%] flex flex-col px-10 py-5 rounded-md shadow-lg ">
         <div class="flex items-center justify-between my-2">
            <p class="text-lg">Create a new task</p>
            <span><i class="fa fa-cancel"></i></span>
         </div>
            <div class="">
            <label for="">Task Name:</label><br>
            <input type="text" class="w-full px-4 py-2 ring-3 ring-red-800  rounded my-2">
            </div>
            <div>
                <label for="">Description</label><br>
              <textarea name="" id="" cols="" rows="2" class="w-full px-4 py-2 ring-3 ring-red-800  rounded my-2 resize-none"></textarea>
            </div>
            <div>
                <label for="">Deadline</label><br>
                <input type="date" class="w-full px-4 py-2 ring-3 ring-red-800  rounded my-2 ">
                 <input type="time" class="w-full px-4 py-3 ring-3 ring-red-800  rounded my-2">
            </div>
           <div>
            <input type="submit" value="Create"  class="bg-red-800 rounded py-2 px-3 font-normal text-white ">
           </div>
        </form>
    
 
  

<div class="flex items-center text-xl bg-gray-50 py-4 justify-between ">
    <span class=""><input type="checkbox"> Dummy task </span>
 <div class="mr-30"><i class="fa fa-ellipsis-vertical" id="toggle-menu"></i>
   <!-- small actions -->
    <div class="cursor-pointer bg-white absolute py-2 px-3 hidden right-1 top-49 opacity-0 transition-all duration-500 pointer-events-none ease-in-out" id="small-menu">
      <p>Edit</p>
      <p>Delete</p>
    </div>
</div>
</div>



 </div>
 <script src="src/js/main.js"></script>
</body>
</html>
